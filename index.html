<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Profil Online - Live Google Sheets</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            width: 90%;
            max-width: 950px;
            padding: 40px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        .fade-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        .photo-container {
            flex-shrink: 0;
            width: 260px;
            height: 320px;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #00d2ff;
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.3);
            background-color: #1a2a3a;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bio-container {
            flex-grow: 1;
        }

        .bio-container h1 {
            font-size: 2.2rem;
            color: #00d2ff;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .bio-container .subtitle {
            font-size: 1.1rem;
            color: #b0bec5;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px 20px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 16px;
            border-radius: 10px;
            border-left: 4px solid #00d2ff;
        }

        .info-item .label {
            font-size: 0.85rem;
            color: #90a4ae;
            display: block;
            margin-bottom: 4px;
        }

        .info-item .value {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .status-bar {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .page-indicator, .sync-tag {
            font-size: 0.85rem;
            color: #00d2ff;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .profile-card {
                flex-direction: column;
                padding: 25px;
                text-align: center;
            }

            .info-grid {
                grid-template-columns: 1fr;
                text-align: left;
            }

            .photo-container {
                width: 200px;
                height: 240px;
            }
        }
    </style>
</head>
<body>

    <div class="profile-card" id="card">
        <div class="photo-container">
            <img id="foto" src="" alt="Foto Profil">
        </div>

        <div class="bio-container">
            <h1 id="nama">Memuat Data...</h1>
            <div class="subtitle" id="jabatan">-</div>

            <div class="info-grid">
                <div class="info-item">
                    <span class="label">NIP / ID</span>
                    <span class="value" id="nip">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Unit Kerja</span>
                    <span class="value" id="unit">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Tempat, Tgl Lahir</span>
                    <span class="value" id="ttl">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Pendidikan</span>
                    <span class="value" id="pendidikan">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Status</span>
                    <span class="value" id="status">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Kontak / Ext</span>
                    <span class="value" id="kontak">-</span>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <div class="page-indicator" id="indicator">Profil 0 dari 0</div>
        <div class="sync-tag" id="sync-status">Live Sync: Google Sheets</div>
    </div>

    <!-- Library PapaParse untuk membaca CSV Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <script>
        // =========================================================================
        // TEMPELKAN LINK 'PUBLISH TO WEB' GOOGLE SHEETS (FORMAT CSV) DI BAWAH INI:
        // =========================================================================
        const googleSheetsCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRukrMmGr9ZwNsWEaSSAvpwCTzeElAuTfl9-ED0IyrT4fhu-FSo8zbuWE8NWig6hnKF7GPU3LJW5v3a/pub?gid=0&single=true&output=csv";

        const durasiSlide = 7000; // 7 detik per slide
        let daftarProfil = [];
        let currentIndex = 0;
        let slideTimer = null;

        // Fungsi membaca data dari Google Sheets
        function loadOnlineData() {
            Papa.parse(googleSheetsCsvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        daftarProfil = results.data;
                        document.getElementById('sync-status').innerText = `Terhubung (Diupdate: ${new Date().toLocaleTimeString()})`;
                        
                        if (!slideTimer) {
                            updateProfile(currentIndex);
                            startSlideshow();
                        }
                    }
                },
                error: function(err) {
                    console.error("Gagal mengambil data online:", err);
                    document.getElementById('sync-status').innerText = "Gagal Sync Online";
                }
            });
        }

        function updateProfile(index) {
            if (daftarProfil.length === 0) return;
            const data = daftarProfil[index];
            const card = document.getElementById('card');

            card.classList.add('fade-out');

            setTimeout(() => {
                document.getElementById('foto').src = data.foto || 'https://via.placeholder.com/260x320?text=No+Photo';
                document.getElementById('nama').innerText = data.nama || '-';
                document.getElementById('jabatan').innerText = data.jabatan || '-';
                document.getElementById('nip').innerText = data.nip || '-';
                document.getElementById('unit').innerText = data.unit || '-';
                document.getElementById('ttl').innerText = data.ttl || '-';
                document.getElementById('pendidikan').innerText = data.pendidikan || '-';
                document.getElementById('status').innerText = data.status || '-';
                document.getElementById('kontak').innerText = data.kontak || '-';

                document.getElementById('indicator').innerText = `Profil ${index + 1} dari ${daftarProfil.length}`;
                card.classList.remove('fade-out');
            }, 500);
        }

        function startSlideshow() {
            slideTimer = setInterval(() => {
                if (daftarProfil.length > 0) {
                    currentIndex = (currentIndex + 1) % daftarProfil.length;
                    updateProfile(currentIndex);
                }
            }, durasiSlide);
        }

        // Ambil data pertama kali
        loadOnlineData();

        // Cek & Sinkronkan data baru dari Google Sheets secara otomatis setiap 1 menit (60000 ms)
        setInterval(loadOnlineData, 60000);
    </script>
</body>
</html>
