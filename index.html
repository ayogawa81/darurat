<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Display Profil Pers Slog Korpasgat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #0b171e, #132730, #1a3644);
            color: #ffffff;
        }

        /* Container Utama Memenuhi 100% Layar */
        .full-container {
            width: 100vw;
            height: 100vh;
            padding: 30px 40px 20px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* KARTU PROFIL MEMENUHI KELUASAN LAYAR */
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 210, 255, 0.3);
            border-radius: 24px;
            width: 100%;
            height: calc(100vh - 100px); /* Mengisi hampir seluruh tinggi layar */
            padding: 40px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 50px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        .fade-out {
            opacity: 0;
            transform: scale(0.98);
        }

        /* FOTO DIPERBESAR TINGGIPENUH */
        .photo-container {
            flex-shrink: 0;
            width: 32%;
            max-width: 420px;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #00d2ff;
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.4);
            background-color: #1a2a3a;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bio-container {
            flex-grow: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* NAMA DAN JABATAN EXTRA BESAR */
        .bio-container h1 {
            font-size: 3.2rem;
            color: #00d2ff;
            margin-bottom: 8px;
            letter-spacing: 1px;
            line-height: 1.1;
            text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .bio-container .subtitle {
            font-size: 1.6rem;
            color: #b0bec5;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }

        /* GRID INFORMASI MEMENUHI AREA */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px 25px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.35);
            padding: 20px 24px;
            border-radius: 14px;
            border-left: 6px solid #00d2ff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .info-item .label {
            font-size: 1.05rem;
            color: #90a4ae;
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-item .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
        }

        /* STATUS BAR DI BAGIAN BAWAH LAYAR */
        .status-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .page-indicator, .sync-tag {
            font-size: 1rem;
            color: #00d2ff;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 22px;
            border-radius: 20px;
            letter-spacing: 1px;
            border: 1px solid rgba(0, 210, 255, 0.25);
        }

        /* PENYESUAIAN PADA TV BERESOLUSI LEBIH KECIL */
        @media (max-height: 700px) {
            .bio-container h1 { font-size: 2.4rem; }
            .bio-container .subtitle { font-size: 1.2rem; margin-bottom: 20px; }
            .info-item { padding: 12px 18px; }
            .info-item .value { font-size: 1.2rem; }
        }
    </style>
</head>
<body onclick="toggleFullscreen()">

    <div class="full-container">
        <!-- KARTU UTAMA FULL LAYAR -->
        <div class="profile-card" id="card">
            <div class="photo-container">
                <img id="foto" src="" alt="Foto Profil">
            </div>

            <div class="bio-container">
                <h1 id="nama">Memuat Data...</h1>
                <div class="subtitle" id="jabatan">-</div>

                <div class="info-grid">
                    <div class="info-item">
                        <span class="label">Pangkat</span>
                        <span class="value" id="pangkat">-</span>
                    </div>
                    <div class="info-item">
                        <span class="label">NRP</span>
                        <span class="value" id="nrp">-</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Tempat Lahir</span>
                        <span class="value" id="tempat_lahir">-</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Tanggal Lahir</span>
                        <span class="value" id="tanggal_lahir">-</span>
                    </div>
                    <div class="info-item" style="grid-column: span 2;">
                        <span class="label">Kontak / HP</span>
                        <span class="value" id="kontak">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- STATUS BAR BAWAH -->
        <div class="status-bar">
            <div class="page-indicator" id="indicator">Profil 0 dari 0</div>
            <div class="sync-tag" id="sync-status">Live Sync: Google Sheets</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <script>
        const googleSheetsCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRukrMmGr9ZwNsWEaSSAvpwCTzeElAuTfl9-ED0IyrT4fhu-FSo8zbuWE8NWig6hnKF7GPU3LJW5v3a/pub?gid=0&single=true&output=csv";

        const durasiSlide = 7000;
        let daftarProfil = [];
        let currentIndex = 0;
        let slideTimer = null;

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            }
        }

        function convertDriveUrl(url) {
            if (!url) return 'https://via.placeholder.com/420x550?text=No+Photo';
            if (url.includes('drive.google.com')) {
                const matches = url.match(/\/d\/([^\/\?]+)/);
                if (matches && matches[1]) {
                    return `https://lh3.googleusercontent.com/d/${matches[1]}`;
                }
            }
            return url;
        }

        function loadOnlineData() {
            Papa.parse(googleSheetsCsvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        daftarProfil = results.data;
                        document.getElementById('sync-status').innerText = `Terhubung (${new Date().toLocaleTimeString()})`;
                        
                        if (!slideTimer) {
                            updateProfile(currentIndex);
                            startSlideshow();
                        }
                    }
                },
                error: function(err) {
                    document.getElementById('sync-status').innerText = "Gagal Sync Online";
                }
            });
        }

        function updateProfile(index) {
            if (daftarProfil.length === 0) return;
            const rawData = daftarProfil[index];
            const card = document.getElementById('card');

            const data = {};
            Object.keys(rawData).forEach(key => {
                const cleanKey = key.trim().toLowerCase();
                data[cleanKey] = rawData[key];
            });

            card.classList.add('fade-out');

            setTimeout(() => {
                document.getElementById('foto').src = convertDriveUrl(data['foto']);
                document.getElementById('nama').innerText = data['nama'] || '-';
                document.getElementById('jabatan').innerText = data['jabatan'] || '-';
                document.getElementById('pangkat').innerText = data['pangkat'] || '-';
                document.getElementById('nrp').innerText = data['nrp'] || '-';
                document.getElementById('tempat_lahir').innerText = data['tempat lahir'] || '-';
                document.getElementById('tanggal_lahir').innerText = data['tanggal lahir'] || '-';
                document.getElementById('kontak').innerText = data['kontak'] || '-';

                document.getElementById('indicator').innerText = `Profil ${index + 1} dari ${daftarProfil.length}`;
                card.classList.remove('fade-out');
            }, 500);
        }

        function startSlideshow() {
            slideTimer = setInterval(() => {
                if (daftarProfil.length > 0) {
                    currentIndex = (currentIndex + 1) % daftarProfil.length;
                    updateProfile(currentIndex);
                }
            }, durasiSlide);
        }

        loadOnlineData();
        setInterval(loadOnlineData, 60000);
    </script>
</body>
</html>
