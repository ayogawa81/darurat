<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Display Profil Pers Slog Korpasgat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* Memastikan Body Mengisi 100% Layar TV & PC */
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Menghilangkan Scrollbar */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            width: 88vw;
            max-width: 1100px;
            height: auto;
            max-height: 80vh;
            padding: 3vw;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 3vw;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        .fade-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        .photo-container {
            flex-shrink: 0;
            width: 280px;
            height: 350px;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #00d2ff;
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.3);
            background-color: #1a2a3a;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bio-container {
            flex-grow: 1;
        }

        .bio-container h1 {
            font-size: 2.2rem;
            color: #00d2ff;
            margin-bottom: 6px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .bio-container .subtitle {
            font-size: 1.15rem;
            color: #b0bec5;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px 20px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 18px;
            border-radius: 10px;
            border-left: 4px solid #00d2ff;
        }

        .info-item .label {
            font-size: 0.85rem;
            color: #90a4ae;
            display: block;
            margin-bottom: 4px;
        }

        .info-item .value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .status-bar {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .page-indicator, .sync-tag {
            font-size: 0.85rem;
            color: #00d2ff;
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 18px;
            border-radius: 20px;
            letter-spacing: 1px;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }

        /* Penyesuaian Responsif untuk Layar HP / TV Beresolusi Kecil */
        @media (max-width: 850px) {
            .profile-card {
                flex-direction: column;
                padding: 20px;
                text-align: center;
                max-height: 90vh;
                overflow-y: auto;
            }

            .info-grid {
                grid-template-columns: 1fr;
                text-align: left;
            }

            .photo-container {
                width: 200px;
                height: 250px;
            }
        }
    </style>
</head>
<body onclick="toggleFullscreen()">

    <div class="profile-card" id="card">
        <div class="photo-container">
            <img id="foto" src="" alt="Foto Profil">
        </div>

        <div class="bio-container">
            <h1 id="nama">Memuat Data...</h1>
            <div class="subtitle" id="jabatan">-</div>

            <div class="info-grid">
                <div class="info-item">
                    <span class="label">Pangkat</span>
                    <span class="value" id="pangkat">-</span>
                </div>
                <div class="info-item">
                    <span class="label">NRP</span>
                    <span class="value" id="nrp">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Tempat Lahir</span>
                    <span class="value" id="tempat_lahir">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Tanggal Lahir</span>
                    <span class="value" id="tanggal_lahir">-</span>
                </div>
                <div class="info-item" style="grid-column: span 2;">
                    <span class="label">Kontak / HP</span>
                    <span class="value" id="kontak">-</span>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <div class="page-indicator" id="indicator">Profil 0 dari 0</div>
        <div class="sync-tag" id="sync-status">Live Sync: Google Sheets</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <script>
        const googleSheetsCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRukrMmGr9ZwNsWEaSSAvpwCTzeElAuTfl9-ED0IyrT4fhu-FSo8zbuWE8NWig6hnKF7GPU3LJW5v3a/pub?gid=0&single=true&output=csv";

        const durasiSlide = 7000;
        let daftarProfil = [];
        let currentIndex = 0;
        let slideTimer = null;

        // Mode Fullscreen Otomatis saat Klik / Sentuh Layar
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Gagal masuk mode fullscreen: ${err.message}`);
                });
            }
        }

        function convertDriveUrl(url) {
            if (!url) return 'https://via.placeholder.com/280x350?text=No+Photo';
            if (url.includes('drive.google.com')) {
                const matches = url.match(/\/d\/([^\/\?]+)/);
                if (matches && matches[1]) {
                    return `https://lh3.googleusercontent.com/d/${matches[1]}`;
                }
            }
            return url;
        }

        function loadOnlineData() {
            Papa.parse(googleSheetsCsvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true
